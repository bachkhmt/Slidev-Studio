appId: com.slidev.studio
productName: Slidev Studio
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: electron/templates
    to: templates
mac:
  target:
    - target: dir
    - target: dmg
  identity: null
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: build/icon.icns
win:
  target:
    - nsis
  icon: build/icon.png
linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
