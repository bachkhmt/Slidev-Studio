appId: com.slidev.studio
productName: Slidev Studio
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: electron/templates
    to: templates
mac:
  target:
    - target: dir
    - target: dmg
  identity: null
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: build/icon.icns
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: '${productName}-Setup-${version}-${arch}.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Slidev Studio
linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
